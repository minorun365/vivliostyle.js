name: PR 2132 Layout Validation

on:
  push:
    branches:
      - codex/pr-2132-validation-final
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Start development viewer
        run: |
          yarn dev > /tmp/vivliostyle-dev.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3300/viewer/lib/vivliostyle-viewer-dev.html > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/vivliostyle-dev.log
          exit 1

      - name: Compare focused layout cases
        id: layout
        continue-on-error: true
        run: |
          set +e
          yarn test:layout-regression \
            --actual-viewer dev \
            --baseline-viewer stable \
            --file target-text-shrinking-spine/publication.json \
            --out-dir artifacts/layout-regression-warmup \
            --concurrency 1 \
            --timeout 180
          yarn test:layout-regression \
            --actual-viewer dev \
            --baseline-viewer stable \
            --file page_breaks/break-before-flex-at-page-start.html \
            --file page_breaks/combine_breaks_2.html \
            --file target-counter-retained-source/publication.json \
            --file target-text-shrinking-spine/publication.json \
            --concurrency 1 \
            --timeout 60
          for attempt in 1 2 3 4 5; do
            yarn test:layout-regression \
              --actual-viewer dev \
              --baseline-viewer stable \
              --file target-counter-retained-source/publication.json \
              --file target-text-shrinking-spine/publication.json \
              --out-dir "artifacts/layout-regression-repeat-$attempt" \
              --concurrency 1 \
              --timeout 60
          done

      - name: Assert expected results and completed pagination
        run: node scripts/assert-pr-2132-layout-validation.mjs

      - name: Assert forward references use rebuilt target snapshots
        run: node scripts/assert-pr-2132-forward-reference.mjs

      - name: Assert changed retained references are repaginated
        run: node scripts/assert-pr-2132-retained-source.mjs

      - name: Assert five consecutive completed runs
        run: node scripts/assert-pr-2132-repeat.mjs

      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pr-2132-layout-validation
          path: artifacts/layout-regression*/
          retention-days: 30
