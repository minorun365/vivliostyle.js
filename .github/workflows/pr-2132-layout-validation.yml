name: PR 2132 Layout Validation

on:
  push:
    branches:
      - codex/pr-2132-validation-final

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Start development viewer
        run: |
          yarn dev > /tmp/vivliostyle-dev.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3300/viewer/lib/vivliostyle-viewer-dev.html > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/vivliostyle-dev.log
          exit 1

      - name: Compare focused layout cases
        id: layout
        continue-on-error: true
        run: |
          set +e
          for attempt in 1 2 3 4 5; do
            yarn test:layout-regression \
              --actual-viewer dev \
              --baseline-viewer stable \
              --file target-text-shrinking-spine/publication.json \
              --out-dir "artifacts/layout-regression-$attempt" \
              --concurrency 1 \
              --timeout 60
          done

      - name: Assert repeated pagination completion
        run: node scripts/assert-pr-2132-repeat.mjs

      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pr-2132-layout-validation
          path: artifacts/layout-regression-*/
          retention-days: 30
